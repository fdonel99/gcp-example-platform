name: "Terraform CI/CD - Produzione"

on:
  push:
    branches:
      - main 
    paths-ignore:
      - 'docs/**.md'
      - '**.md'

permissions:
  contents: write

jobs:
  terraform:
    name: "Terraform Deploy Prod"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: environments/prod
        
    env:
      TF_VAR_telegram_token_value: ${{ secrets.TELEGRAM_TOKEN }}
      TF_VAR_telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Autenticazione GCP (Prod)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan
      
      - name: Terraform Apply
        run: terraform apply -auto-approve 

      - name: Estrai Output Document AI
        id: tf_outputs
        run: |
          # Prende il path completo generato da Terraform 
          FULL_PATH=$(terraform output -raw document_ai_processor_id)
          
          # Ritaglia solo l'ultimo pezzo (l'ID alfanumerico)
          PROCESSOR_ID=$(echo $FULL_PATH | awk -F'/' '{print $6}')
          
          # Lo salva nelle variabili d'ambiente di GitHub Actions
          echo "PROCESSOR_ID=$PROCESSOR_ID" >> $GITHUB_ENV
          echo "Processore estratto con successo: $PROCESSOR_ID"
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze Python
        working-directory: '.' 
        run: pip install openai requests

      - name: Esegui Agenti di Documentazione
        working-directory: '.'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }} 
          ENVIRONMENT: "prod"
          PROCESSOR_ID: ${{ env.PROCESSOR_ID }}
        run: python scripts/generate_docs.py

      - name: Commit e Push Documentazione
        working-directory: '.'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ .docs_state_*.json
          git diff --staged --quiet || (git commit -m "docs: aggiornamento doc main post-deploy [skip ci]" && git push origin main)